context:
  version: "6.2.0"

package:
  name: fake
  version: ${{ version }}

source:
  url: https://github.com/fsprojects/fake/archive/${{ version }}.tar.gz
  sha256: af69285aefc632b566dee3f198130e593ceabb60b3e9d2c99e43234e173e7bd5

build:
  number: 0
  noarch: generic

requirements:
  host:
    - dotnet
    - nuget-license
  run:
    - dotnet

tests:
  - script:
      - fake-cli --help

about:
  license: Apache-2.0
  license_file:
    - License.txt
    - license-files/
  summary: FAKE - F# Make
  homepage: https://fake.build
  repository: https://github.com/fsprojects/fake

extra:
  recipe-maintainers:
    - danielnachun

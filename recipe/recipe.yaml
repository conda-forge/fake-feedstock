context:
  version: "6.1.5"

package:
  name: fake
  version: ${{ version }}

source:
  url: https://github.com/fsprojects/fake/archive/${{ version }}.tar.gz
  sha256: e72fb78077d3921a36152029ca97d46d08c1a0ec0e1597c34cbbc955c99d3733

build:
  number: 0
  noarch: generic

requirements:
  host:
    - dotnet
    - nuget-license
  run:
    - dotnet

tests:
  - script:
      - fake-cli --help

about:
  license: Apache-2.0
  license_file:
    - License.txt
    - license-files/
  summary: FAKE - F# Make
  homepage: https://fake.build
  repository: https://github.com/fsprojects/fake

extra:
  recipe-maintainers:
    - danielnachun
